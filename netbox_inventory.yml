---
plugin: netbox.netbox.nb_inventory
api_endpoint: "{{ lookup('env', 'NETBOX_URL') | default('http://netbox.netbox.svc.cluster.local') }}"
token: "{{ lookup('env', 'NETBOX_TOKEN') | default(netbox_token) }}"
validate_certs: false
timeout: 60
group_by:
  - device_roles
compose:
  ansible_host: primary_ip4 | default(ansible_host)

