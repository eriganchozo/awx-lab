---
plugin: netbox.netbox.nb_inventory
api_endpoint: http://netbox.netbox.svc.cluster.local
token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
validate_certs: false
timeout: 60
group_by:
  - device_roles
compose:
  ansible_host: primary_ip4 | default(ansible_host)
keyed_groups:
  - key: device_role.slug
    prefix: role

