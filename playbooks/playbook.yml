---
- name: AWX + NetBox Dynamic Inventory Demo
  hosts: all
  gather_facts: false

  tasks:        
    - name: Check if file exists
      raw: 'test -f /tmp/awx-demo-{{ inventory_hostname }}.txt'
      register: file_exists
      failed_when: false
      changed_when: false

    - name: Create file if not exists
      raw: 'echo "AWX Demo - {{ inventory_hostname }} - {{ ansible_host }}" > /tmp/awx-demo-{{ inventory_hostname }}.txt'
      when: file_exists.rc != 0

    - name: Show result
      debug:
        msg: |
          Device: {{ inventory_hostname }} ({{ ansible_host }})
          {% if file_exists.rc == 0 %}
          Status: File already existed
          {% else %}
          Status: File created
          {% endif %}
          Content: {{ file_content.stdout }}
