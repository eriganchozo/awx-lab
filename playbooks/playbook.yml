---
- name: AWX + NetBox Dynamic Inventory Demo
  hosts: all
  gather_facts: false

  tasks:        
    - name: Create file only if not exists
      raw: 'test -f /tmp/awx-demo-{{ inventory_hostname }}.txt || echo "AWX Demo - {{ inventory_hostname }} - {{ ansible_host }}" > /tmp/awx-demo-{{ inventory_hostname }}.txt'
      register: result
      changed_when: "'AWX Demo' in result.stdout"

    - name: Show file content
      raw: 'cat /tmp/awx-demo-{{ inventory_hostname }}.txt'
      register: file_content
      changed_when: false

    - name: Show result
      debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}): {{ file_content.stdout }}"
 
