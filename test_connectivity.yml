---
- name: Demo inventario dinámico NetBox - Plugin Oficial
  hosts: all
  gather_facts: false
  connection: local
  
  tasks:
    - name: Mostrar información del dispositivo
      ansible.builtin.debug:
        msg: |
          ✅ PLUGIN OFICIAL NETBOX FUNCIONANDO!
          
          📛 Dispositivo: {{ inventory_hostname }}
          🌐 IP: {{ primary_ip4 | default('No configurada') }}
          🏢 Sitio: {{ sites[0] | default('No definido') }}
          🔧 Tipo: {{ device_types[0] | default('No definido') }}
          👤 Rol: {{ device_roles[0] | default('No definido') }}
          📊 Estado: {{ status.value | default('No definido') }}
          🏷️  Grupos: {{ group_names | join(', ') }}
          
          🎯 Listo para usar en AWX con plugin oficial!