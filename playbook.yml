---
- name: Demo AWX con inventario dinámico NetBox
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: Crear archivo de demostración
      ansible.builtin.copy:
        content: |
          Dispositivo: {{ inventory_hostname }}
          IP: {{ primary_ip4 | default('No configurada') }}
          Tipo: {{ device_types[0] | default('No definido') }}
          Estado: {{ status.value | default('No definido') }}
                    
        dest: "/tmp/awx-netbox-demo-{{ inventory_hostname }}.txt"
        mode: '0644'
      register: result

    - name: Confirmar creación del archivo
      ansible.builtin.debug:
        msg: |
          Archivo: /tmp/awx-netbox-demo-{{ inventory_hostname }}.txt
          Dispositivo: {{ inventory_hostname }} ({{ primary_ip4 | default('Sin IP') }})