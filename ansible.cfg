[defaults]
host_key_checking = False
timeout = 60
gathering = explicit
retry_files_enabled = False
remote_tmp = /tmp/.ansible/tmp

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[inventory]
enable_plugins = netbox.netbox.nb_inventory
cache = True
cache_plugin = memory
cache_timeout = 3600
